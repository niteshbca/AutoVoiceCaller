name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      TWILIO_SID: ${{ secrets.TWILIO_SID }}
      TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
      TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Show Gradle version
        run: gradle --version
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build Debug APK (verbose)
        run: gradle --no-daemon --stacktrace -Pkotlin.compiler.execution.strategy=in-process --info assembleDebug 2>&1 | tail -200
      - name: Run Lint (non-blocking)
        run: gradle --no-daemon lintDebug || true
      - uses: actions/upload-artifact@v5
        with:
          name: AutoVoiceCaller-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
